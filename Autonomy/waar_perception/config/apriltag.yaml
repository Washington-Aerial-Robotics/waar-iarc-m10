apriltag_mine_node:
  ros__parameters:
    drone_id: d1
    image_topic: /camera/left/image_rect
    camera_info_topic: /camera/left/camera_info
    map_frame: map
    # REQUIRED CALIBRATION: measure the black AprilTag square on the exact
    # flight marker. Do not proceed to HIL with this example value unverified.
    tag_size_m: 0.0381
    minimum_pixel_area: 225.0
    reprojection_error_scale_px: 4.0
    minimum_confidence: 0.25
    verification_confidence: 0.65
    verification_max_distance_m: 2.0
    max_detection_distance_m: 15.0
    republish_interval_s: 2.0
    arena_x_min: 0.0
    arena_x_max: 91.44
    arena_y_min: 0.0
    arena_y_max: 24.38
